name: order-agent
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先复制 .env.example 为 .env}
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:?缺少应用数据库密码}
      SIMULATOR_DB_PASSWORD: ${SIMULATOR_DB_PASSWORD:?缺少模拟数据库密码}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    image: order-agent-backend:0.1.0
    build:
      context: .
      args:
        MODULE: backend
    environment:
      BACKEND_DB_URL: jdbc:postgresql://postgres:5432/agent_app
      BACKEND_DB_USER: backend_app
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:?缺少应用数据库密码}
      MODEL_MODE: ${MODEL_MODE:-stub}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      BACKEND_PORT: "8080"
      SPRING_PROFILES_ACTIVE: ${BACKEND_PROFILE:-demo}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-500}
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-30000}
      WORKER_STEP_DELAY_MS: ${WORKER_STEP_DELAY_MS:-1000}
      WORKER_RETRY_MS: ${WORKER_RETRY_MS:-1000}
      WORKER_MAX_FAILURES: ${WORKER_MAX_FAILURES:-3}
      DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD:-}
      DEMO_APPROVER_PASSWORD: ${DEMO_APPROVER_PASSWORD:-}
      DEMO_OPERATOR_ORDER_PREFIX: ${DEMO_OPERATOR_ORDER_PREFIX:-T05-ORDER-}
      DEMO_APPROVER_ORDER_PREFIX: ${DEMO_APPROVER_ORDER_PREFIX:-T05-ORDER-}
      SIMULATOR_BASE_URL: http://simulator:8081
      SIMULATOR_READ_TOKEN: ${SIMULATOR_READ_TOKEN:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "/opt/health/HealthCheck.java", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5
  simulator:
    image: order-agent-simulator:0.1.0
    build:
      context: .
      args:
        MODULE: simulator
    environment:
      SIMULATOR_DB_URL: jdbc:postgresql://postgres:5432/agent_simulator
      SIMULATOR_DB_USER: simulator_app
      SIMULATOR_DB_PASSWORD: ${SIMULATOR_DB_PASSWORD:?缺少模拟数据库密码}
      SIMULATOR_PORT: "8081"
      SPRING_PROFILES_ACTIVE: ${SIMULATOR_PROFILE:-demo}
      SIMULATOR_READ_TOKEN: ${SIMULATOR_READ_TOKEN:-}
      SIMULATOR_EXECUTE_TOKEN: ${SIMULATOR_EXECUTE_TOKEN:-}
      SIMULATOR_ADMIN_TOKEN: ${SIMULATOR_ADMIN_TOKEN:-}
    ports:
      - "127.0.0.1:${SIMULATOR_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "/opt/health/HealthCheck.java", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5
volumes:
  postgres_data:
