spring:
  application:
    name: order-agent-backend
  profiles:
    default: demo
  datasource:
    url: ${BACKEND_DB_URL:jdbc:postgresql://localhost:5432/agent_app}
    username: ${BACKEND_DB_USER:backend_app}
    password: ${BACKEND_DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  sql:
    init:
      mode: never
server:
  port: ${BACKEND_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
agent:
  model:
    mode: ${MODEL_MODE:stub}
