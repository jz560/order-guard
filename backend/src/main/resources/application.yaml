spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  application:
    name: order-agent-backend
  profiles:
    default: demo
  datasource:
    url: ${BACKEND_DB_URL:jdbc:postgresql://localhost:5432/agent_app}
    username: ${BACKEND_DB_USER:backend_app}
    password: ${BACKEND_DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  sql:
    init:
      mode: never
server:
  port: ${BACKEND_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
agent:
  diagnosis:
    mode: ${DIAGNOSIS_MODE:agent}
    rounds: ${DIAGNOSIS_ROUNDS:6}
    tools: ${DIAGNOSIS_TOOLS:12}
    repeats: ${DIAGNOSIS_REPEATS:2}
    reviews: ${DIAGNOSIS_REVIEWS:1}
    timeout-ms: ${DIAGNOSIS_TIMEOUT_MS:30000}
    total-ms: ${DIAGNOSIS_TOTAL_MS:120000}
    review-ms: ${DIAGNOSIS_REVIEW_MS:10000}
  worker:
    enabled: ${WORKER_ENABLED:true}
    poll-ms: ${WORKER_POLL_MS:500}
    lease-ms: ${WORKER_LEASE_MS:30000}
    step-delay-ms: ${WORKER_STEP_DELAY_MS:1000}
    retry-ms: ${WORKER_RETRY_MS:1000}
    max-failures: ${WORKER_MAX_FAILURES:3}
  accounts:
    operator:
      password: ${DEMO_OPERATOR_PASSWORD:}
      order-prefix: ${DEMO_OPERATOR_ORDER_PREFIX:T05-ORDER-}
    approver:
      password: ${DEMO_APPROVER_PASSWORD:}
      order-prefix: ${DEMO_APPROVER_ORDER_PREFIX:T05-ORDER-}
  execution:
    http-timeout-ms: ${EXECUTION_HTTP_TIMEOUT_MS:3000}
  simulator:
    base-url: ${SIMULATOR_BASE_URL:http://localhost:8081}
    read-token: ${SIMULATOR_READ_TOKEN:}
    execute-token: ${SIMULATOR_EXECUTE_TOKEN:}
  model:
    mode: ${MODEL_MODE:stub}
mybatis:
  type-handlers-package: com.example.orderagent.backend.task
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
