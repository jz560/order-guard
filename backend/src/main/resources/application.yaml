spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  application:
    name: order-agent-backend
  profiles:
    default: demo
  datasource:
    url: ${BACKEND_DB_URL:jdbc:postgresql://localhost:5432/agent_app}
    username: ${BACKEND_DB_USER:backend_app}
    password: ${BACKEND_DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  sql:
    init:
      mode: never
server:
  port: ${BACKEND_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
agent:
  accounts:
    operator:
      password: ${DEMO_OPERATOR_PASSWORD:}
      order-prefix: ${DEMO_OPERATOR_ORDER_PREFIX:T05-ORDER-}
    approver:
      password: ${DEMO_APPROVER_PASSWORD:}
      order-prefix: ${DEMO_APPROVER_ORDER_PREFIX:T05-ORDER-}
  simulator:
    base-url: ${SIMULATOR_BASE_URL:http://localhost:8081}
    read-token: ${SIMULATOR_READ_TOKEN:}
  model:
    mode: ${MODEL_MODE:stub}
mybatis:
  type-handlers-package: com.example.orderagent.backend.task
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
