spring:
  application:
    name: order-agent-simulator
  profiles:
    default: demo
  datasource:
    url: ${SIMULATOR_DB_URL:jdbc:postgresql://localhost:5432/agent_simulator}
    username: ${SIMULATOR_DB_USER:simulator_app}
    password: ${SIMULATOR_DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  sql:
    init:
      mode: never
server:
  port: ${SIMULATOR_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
